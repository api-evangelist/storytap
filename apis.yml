apis:
- name: StoryTap Video Widget API
  description: >-
    The JSON API behind StoryTap's embeddable video widgets. Brands load a
    first-party loader script from StoryTap's CDN, and that script POSTs to
    api.storytap.com/w/* to fetch an embed's configuration and video/Q&A payload,
    submit visitor questions and video feedback, and flush a batched client event
    queue. Requests carry a public per-embed key and embed id in the JSON body.
    This surface is UNDOCUMENTED — StoryTap publishes no developer portal,
    reference or machine-readable spec for it; it was discovered in StoryTap's own
    public embed script and confirmed live by probe on 2026-08-13. StoryTap also
    markets a REST API and advanced webhooks on Enterprise plans, evidenced
    publicly only through its own Zapier app (campaigns, brands, invites, events);
    no base URL is published for that surface, so it is recorded in
    integrations/storytap-integrations.yml rather than claimed here.
  humanURL: https://storytap.com/video-player-and-geo/
  baseURL: https://api.storytap.com
