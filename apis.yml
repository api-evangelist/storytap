name: StoryTap
description: >-
  StoryTap is a patented AI-powered user-generated video (UGC) platform that
  automates the collection, editing, captioning, and distribution of authentic
  customer video testimonials and stories. It guides customers through recording
  on their own devices with no film crew or production stack, auto-edits
  share-ready clips, and publishes them to websites, social media, and Google
  Reviews. StoryTap holds six utility patents and is used by brands including
  TELUS, Samsung, Danone, Canadian Tire, AAA, and UCLA Anderson. A REST API and
  advanced webhooks are offered on Enterprise plans (not publicly documented).
  StoryTap is backed by Techstars and the Lazaridis Institute.
